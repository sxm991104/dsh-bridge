name: tests

# 为什么要有 CI
#
#   这一版发布时带着 4 条红叉出去了。
#
#   原因很简单：我的测试都是本地手动跑的，
#   而"手动跑"的意思是——有时候忘了跑。
#
#   有人拉下来跑，发现 4 条失败，其中 1 条是真的。
#   他指出的不是安全能力问题，是工程缺口：
#
#       「最该补的不是更多载荷，是 CI。」
#
#   他说得对。
#
#   这个 workflow 要做的事：
#       · 每次 push / PR 都在干净环境跑一遍
#       · 两个平台都跑（Windows 和 Linux）
#         因为很多"漏洞"其实是平台差异——比如 D:/ 在 Linux 上
#         不是绝对路径，在 Windows 上是。只测一个平台会漏。
#       · 红叉就不许合

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false        # 一个平台挂了，另一个也要跑完
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: 装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # 可选依赖缺失时相关格式会跳过，不该让 CI 挂。
      # 但装一下能覆盖到文档解析那部分。
      - name: 装可选依赖（失败不阻塞）
        continue-on-error: true
        run: |
          python -m pip install python-docx openpyxl python-pptx pypdf

      - name: 跑回归测试
        run: python tests/run_all.py

      - name: 跑暴力攻击测试
        run: python tests/brute_force.py

      # ⚠️ 这一步比上面两步都重要。
      #
      #    单元测试和攻击测试都是"逻辑对不对"。
      #    它们证明不了"这个项目能不能跑起来"——
      #    桥能不能 dispatch、引擎能不能真的写文件、
      #    会话能不能存盘、文件锁在这个平台上会不会崩。
      #
      #    这一步是：不调真模型（用一个照剧本回话的假模型），
      #    但工具调用是真的，文件操作是真的，锁是真的。
      #    整条链路跑一遍，看能不能跑完。
      #
      #    这就是"测试过了"和"跑得起来"之间的那道坎。
      - name: 冒烟测试（整条链路真跑一遍）
        run: python tests/smoke.py
